name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build and Test
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Xcode 26.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.2"

      - name: Verify Xcode version
        run: xcodebuild -version

      - name: Install dependencies
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Install xcpretty
        run: gem install xcpretty --no-document

      - name: Swift Package Manager - Build
        run: swift build

      - name: Swift Package Manager - Test
        run: swift test

      - name: Xcode - Build
        run: |
          xcodebuild \
            -project Annotate.xcodeproj \
            -scheme Annotate \
            -configuration Debug \
            -derivedDataPath build/derivedData \
            -destination "platform=macOS" \
            clean build | xcpretty && exit ${PIPESTATUS[0]}

      # Uploaded straight after the build so a test failure later in the job still leaves
      # a runnable app to try. Debug builds are ad-hoc signed: remove the quarantine after
      # downloading (`xattr -dr com.apple.quarantine Annotate.app`).
      - name: Upload Annotate.app
        uses: actions/upload-artifact@v4
        with:
          name: Annotate-debug-app
          path: build/derivedData/Build/Products/Debug/
          if-no-files-found: error
          retention-days: 14

      - name: Xcode - Test
        run: |
          xcodebuild \
            -project Annotate.xcodeproj \
            -scheme Annotate \
            -configuration Debug \
            -destination "platform=macOS" \
            test | xcpretty && exit ${PIPESTATUS[0]}
