name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build and Test
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Redraw site ratchet
        run: scripts/ci/check-redraw-sites.sh

      - name: Check the settings access guard against fixtures
        run: ./scripts/ci/check_settings_access_test.sh

      - name: Check settings access goes through SettingsStore
        run: ./scripts/ci/check_settings_access.sh

      - name: Setup Xcode 26.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.2"

      - name: Verify Xcode version
        run: xcodebuild -version

      - name: Run SwiftLint
        run: |
          swift package plugin --allow-writing-to-package-directory swiftlint

      - name: Check SwiftLint custom rules
        run: ./scripts/ci/check_swiftlint_custom_rules.sh

      - name: Install dependencies
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Install xcpretty
        run: gem install xcpretty --no-document

      - name: Swift Package Manager - Test
        run: swift test

      # xcpretty drops the output of failed tool steps like ExtractAppIntentsMetadata, so the
      # raw log is kept and the failure step below prints it.
      - name: Xcode - Build
        run: |
          set -o pipefail
          xcodebuild \
            -project Annotate.xcodeproj \
            -scheme Annotate \
            -configuration Debug \
            -destination "platform=macOS" \
            build 2>&1 | tee xcodebuild-build.log | xcpretty

      - name: Xcode - Test
        run: |
          set -o pipefail
          xcodebuild \
            -project Annotate.xcodeproj \
            -scheme Annotate \
            -configuration Debug \
            -destination "platform=macOS" \
            test 2>&1 | tee xcodebuild-test.log | xcpretty

      - name: Show raw xcodebuild errors
        if: failure()
        run: |
          for log in xcodebuild-*.log; do
            [ -f "$log" ] || continue
            echo "::group::$log"
            grep -n -E -A25 "error:|failed with a nonzero exit code|^ExtractAppIntentsMetadata" "$log" | tail -300 || true
            echo "::endgroup::"
          done
